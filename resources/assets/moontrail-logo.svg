<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 160" role="img" aria-labelledby="t1 d1">
  <title id="t1">MoonTrail logo</title>
  <desc id="d1">Crescent moon merged with an open ledger — transparency, audit trail, and version history.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1030"/>
      <stop offset="100%" stop-color="#0c0a18"/>
    </linearGradient>
    <linearGradient id="moonFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f6e7a1"/>
      <stop offset="100%" stop-color="#e8b830"/>
    </linearGradient>
    <linearGradient id="ledgerFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7c5cff"/>
      <stop offset="100%" stop-color="#4a38c0"/>
    </linearGradient>
    <linearGradient id="ledgerEdge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9b7bff"/>
      <stop offset="100%" stop-color="#5a44d6"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#fff7d6" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#fff7d6" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <rect width="480" height="160" rx="16" fill="url(#bg)"/>

  <!-- moon glow -->
  <circle cx="68" cy="80" r="46" fill="url(#moonGlow)" filter="url(#soft)"/>

  <!-- crescent moon -->
  <g>
    <circle cx="64" cy="80" r="42" fill="url(#moonFill)"/>
    <circle cx="80" cy="72" r="37" fill="url(#bg)"/>
  </g>

  <!-- ledger pages -->
  <g>
    <path d="M130 44 L210 44 L214 48 L214 116 L130 116 Z" fill="url(#ledgerFill)" opacity="0.92"/>
    <path d="M130 44 L134 48 L214 48 L214 116 L214 116 L210 116 L130 116 Z" fill="url(#ledgerEdge)" opacity="0.55"/>
    <line x1="140" y1="64" x2="204" y2="64" stroke="#e8e0ff" stroke-width="1.5" opacity="0.55"/>
    <line x1="140" y1="76" x2="196" y2="76" stroke="#e8e0ff" stroke-width="1.5" opacity="0.45"/>
    <line x1="140" y1="88" x2="200" y2="88" stroke="#e8e0ff" stroke-width="1.5" opacity="0.35"/>
    <line x1="140" y1="100" x2="188" y2="100" stroke="#e8e0ff" stroke-width="1.5" opacity="0.25"/>
  </g>

  <!-- dotted audit trail -->
  <g fill="#9b7bff">
    <circle cx="230" cy="80" r="2.6"/>
    <circle cx="244" cy="74" r="2.4"/>
    <circle cx="258" cy="68" r="2.2"/>
    <circle cx="272" cy="62" r="2.0"/>
    <circle cx="286" cy="56" r="1.8"/>
    <circle cx="300" cy="50" r="1.6"/>
    <circle cx="314" cy="44" r="1.4"/>
  </g>

  <!-- wordmark -->
  <text x="340" y="70" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif"
        font-size="34" font-weight="700" fill="#f3eaff" letter-spacing="0.02em">MoonTrail</text>
  <text x="340" y="96" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif"
        font-size="13" font-weight="500" fill="#9b7bff" letter-spacing="0.18em" text-transform="uppercase">Audit &amp; Versioning</text>
</svg>