<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" role="img" aria-labelledby="mt-title mt-desc">
  <title id="mt-title">MoonTrail</title>
  <desc id="mt-desc">The moon is the sun of the dead, its trail leads where there are no shadows.</desc>

  <defs>
    <linearGradient id="moonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <!-- Mask: white = visible, black = hidden (carves out the crescent) -->
    <mask id="crescentMask">
      <circle cx="50" cy="60" r="26" fill="white"/>
      <circle cx="60" cy="54" r="21" fill="black"/>
    </mask>
  </defs>

  <!-- Crescent moon via mask — transparent cutout, works on any background -->
  <circle cx="50" cy="60" r="26" fill="url(#moonGrad)" mask="url(#crescentMask)"/>

  <!-- Trail: arc of dots fading from crescent tip -->
  <circle cx="88"  cy="50" r="4"   fill="#7c3aed" opacity="0.80"/>
  <circle cx="105" cy="44" r="3.5" fill="#7c3aed" opacity="0.60"/>
  <circle cx="120" cy="40" r="3"   fill="#8b5cf6" opacity="0.44"/>
  <circle cx="133" cy="38" r="2.5" fill="#a78bfa" opacity="0.30"/>
  <circle cx="144" cy="37" r="2"   fill="#a78bfa" opacity="0.18"/>
  <circle cx="153" cy="37" r="1.5" fill="#c4b5fd" opacity="0.10"/>

  <!-- Wordmark -->
  <text
    x="100" y="78"
    font-family="'Inter', 'Helvetica Neue', 'Segoe UI', Arial, sans-serif"
    font-size="32"
    font-weight="800"
    letter-spacing="1.5"
    fill="#1e1b4b"
  >Moon<tspan fill="#7c3aed">Trail</tspan></text>

  <!-- Tagline -->
  <text
    x="101" y="97"
    font-family="'Inter', 'Helvetica Neue', 'Segoe UI', Arial, sans-serif"
    font-size="9.5"
    font-weight="500"
    letter-spacing="2.8"
    fill="#6d28d9"
    opacity="0.6"
  >AUDIT LOG FOR MOONSHINE</text>
</svg>
